name: initiate_enterprise_build

on:
  pull_request:
    branches:
      - "**"
    types: [synchronize, labeled, ready_for_review, converted_to_draft]
  # Runs once a labelled PR is approved, then for pushes while the approval stands.
  pull_request_review:
    types: [submitted]

concurrency:
  # A review that is not an approval does nothing, so it must not cancel a running dispatch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request_review' && github.event.review.state != 'approved' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  approval:
    # reviewDecision of a stacked PR is judged by the stack's merge rules, so it is what the merge will require.
    if: ${{ github.event.pull_request.head.repo.fork == false && (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && github.event.pull_request.draft == false) && (github.event_name != 'pull_request_review' || github.event.review.state == 'approved') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DECISION=$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)
          echo "reviewDecision: $DECISION"
          APPROVED=false
          if [ "$DECISION" = "APPROVED" ]; then APPROVED=true; fi
          # A second approval or an unrelated label must not rebuild a commit the enterprise build already passed.
          STATE=$(gh api "repos/$GH_REPO/commits/$SHA/status" --jq '.statuses[] | select(.context == "ent-build-status-check") | .state')
          if [ "$APPROVED" = "true" ] && [ "$STATE" = "success" ]; then
            echo "ent-build-status-check already passed on $SHA."
            APPROVED=false
          fi
          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"

  initiate_enterprise_build:
    needs: approval
    if: ${{ needs.approval.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      # Debounce: a push inside this window cancels the run (concurrency) before anything paid starts.
      - if: github.event_name == 'pull_request'
        run: sleep 60
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/classify-changes
        id: classify
        with:
          # github.base_ref is empty on pull_request_review events.
          base: origin/${{ github.event.pull_request.base.ref }}
      # ent-build-status-check is required; when no backend or frontend code changed there is nothing to build,
      # so report it as passed here instead of dispatching.
      - name: Report not applicable
        if: ${{ steps.classify.outputs.run_enterprise != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success -f context=ent-build-status-check -f description="no backend or frontend change; enterprise build not needed"
      - name: Generate token
        if: ${{ steps.classify.outputs.run_enterprise == 'true' }}
        id: generate_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          app-id: ${{ secrets.APP_ID }}
          # Set the owner, so the token can be used in all repositories
          owner: ${{ github.repository_owner }}
      - name: Set build short sha
        if: ${{ steps.classify.outputs.run_enterprise == 'true' }}
        shell: bash
        run: |
          unset SHORT_COMMIT_ID
          echo "SHORT_COMMIT_ID=${GITHUB_HEAD_SHA:0:7}" >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_HEAD_SHA}" >> $GITHUB_ENV

      - name: Confirm git commit SHA output
        if: ${{ steps.classify.outputs.run_enterprise == 'true' }}
        run: echo ${{ env.SHORT_COMMIT_ID }}

      - name: Repository Dispatch
        if: ${{ steps.classify.outputs.run_enterprise == 'true' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        with:
          token: ${{ env.TOKEN }} # access token
          repository: openobserve/o2-enterprise
          event-type: initiate-enterprise-build
          client-payload: '{"o2_enterprise_repo": "${{ env.BRANCH_NAME }}", "o2_opensource_repo": "${{ env.BRANCH_NAME }}" ,"o2_commit_id": "${{ env.SHORT_COMMIT_ID }}", "o2_full_commit":"${{env.COMMIT_ID}}", "o2_target_branch": "${{ github.event.pull_request.base.ref }}"}'
