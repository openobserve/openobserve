name: Isolated UI worker-count proof

on:
  push:
    branches: [bench/ui-alertlist-proof-20261028]
    paths:
      - .github/workflows/ui-alertlist-proof.yml
      - .github/ui-alertlist-proof/**

permissions:
  contents: read

concurrency:
  group: ui-alertlist-proof
  cancel-in-progress: false

jobs:
  proof:
    if: github.event.repository.private == false
    runs-on: ubicloud-standard-8
    timeout-minutes: 28
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize proof budget
        timeout-minutes: 1
        run: |
          printf 'PROOF_EVIDENCE=%s\nPROOF_ARTIFACT=%s\n' "$RUNNER_TEMP/worker-evidence" "$RUNNER_TEMP/worker-artifact" >> "$GITHUB_ENV"
          printf 'PROOF_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/worker-evidence"

      - uses: actions/checkout@v5
        id: checkout
        timeout-minutes: 4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pinned baseline
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=10s 90s git fetch --no-tags --depth=1 --no-recurse-submodules origin 743990d3839a4fa8de4f3fcf31b8d7ca3f00c282
          test "$(git rev-parse FETCH_HEAD)" = 743990d3839a4fa8de4f3fcf31b8d7ca3f00c282

      - name: Verify pinned source and record runner
        timeout-minutes: 1
        run: |
          test "$(git rev-parse HEAD:web)" = 337d85bc38dec7e0e17afea5108d96d4b4a2c0c0
          test -z "$(git status --porcelain -- web)"
          {
            git rev-parse HEAD
            git rev-parse HEAD:web
            uname -a
            lscpu
            free -b
            df -B1 .
          } > "$PROOF_EVIDENCE/runner.txt"

      - uses: actions/setup-node@v7
        id: node
        timeout-minutes: 2
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install once with exact runtime
        timeout-minutes: 5
        working-directory: web
        env:
          NPM_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: |
          printf '%s\n' "$NPM_CACHE_HIT" > "$PROOF_EVIDENCE/npm-cache-hit.txt"
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
          { node --version; npm --version; } > "$PROOF_EVIDENCE/runtime.txt"
          /usr/bin/time -v -o "$PROOF_EVIDENCE/install-resources.txt" npm ci 2>&1 | tee "$PROOF_EVIDENCE/install.log"

      - name: Compare 7-6-6-7 workers with real covered blobs
        timeout-minutes: 24
        run: |
          remaining=$((1440 - $(date +%s) + PROOF_JOB_STARTED))
          if (( remaining > 1320 )); then remaining=1320; fi
          test "$remaining" -gt 0
          python3 .github/ui-alertlist-proof/run-proof.py \
            --web web \
            --output "$PROOF_EVIDENCE/proof" \
            --test-timeout 240 --merge-timeout 90 --overall-timeout "$remaining" \
            2>&1 | tee "$PROOF_EVIDENCE/proof-driver.log"

      - name: Verify source remains unchanged
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 1
        run: |
          mkdir -p "$PROOF_EVIDENCE"
          git diff --exit-code -- web > "$PROOF_EVIDENCE/final-web-diff.txt"
          test -z "$(git status --porcelain -- web)"

      - name: Package bounded evidence
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 1
        run: python3 .github/ui-alertlist-proof/package-evidence.py "$PROOF_EVIDENCE" "$PROOF_ARTIFACT"

      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 2
        with:
          name: isolated-worker-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-artifact/
          retention-days: 1
          if-no-files-found: error
