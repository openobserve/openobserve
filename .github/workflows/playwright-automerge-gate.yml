name: Playwright auto-merge gate

# The full-matrix run queues behind any in-flight smoke run, so a pending playwright_summary stops its green summary letting auto-merge enqueue.
on:
  pull_request:
    # No auto_merge_disabled: check runs can't be deleted, and any completed placeholder would pass; the queued full run completes it.
    types: [auto_merge_enabled, labeled]

concurrency:
  group: playwright-automerge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    # Fork and Dependabot tokens are read-only, so they keep the smoke-only behaviour rather than a placeholder nothing can complete.
    if: >-
      github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || (github.event.label.name == 'ready-for-ci' && github.event.pull_request.auto_merge != null))
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MARKER: playwright-automerge-placeholder
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OPEN=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?check_name=playwright_summary&filter=all&per_page=100" \
                   --jq '.check_runs[] | select(.external_id == $ENV.MARKER and .status != "completed") | .id' | xargs)
          if [ -n "$OPEN" ]; then echo "Placeholder already pending on $SHA: $OPEN"; exit 0; fi
          gh api -X POST "repos/$REPO/check-runs" -f name=playwright_summary -f head_sha="$SHA" \
            -f status=in_progress -f external_id="$MARKER" -f details_url="$RUN_URL" \
            -f "output[title]=Waiting for the full-matrix run" \
            -f "output[summary]=Auto-merge is on; playwright.yml completes this check with the full-matrix result." \
            --jq '"placeholder \(.id) created in check suite \(.check_suite.id)"'
