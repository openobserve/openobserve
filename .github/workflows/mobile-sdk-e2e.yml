# Mobile RUM SDK — End-to-End Tests (self-contained / no secrets)
# =============================================================================================
# Runs tests/mobile-testing (Maestro drives 4 fixture apps → API asserts _rumdata → Playwright
# asserts the RUM dashboard) across RN-Android, Android-native, RN-iOS and iOS-native.
#
# MODEL B — mirrors playwright.yml: each device job stands up its OWN OpenObserve on the runner and
# points the app at it. No shared cluster, no secrets, and every run is fully isolated (so the
# Android and iOS jobs run in PARALLEL — each has its own instance).
#   · RUM ingestion is OSS, so a plain OpenObserve accepts the data.
#   · The apps read their RUM target from a build-time-overridable config (committed default = dev
#     cluster; CI regenerates it): rum.config.json (RN), BuildConfig (android-native),
#     GeneratedConfig.swift (ios-native). See docs/CI-NOTES.md.
#   · Emulator networking: Android reaches the host at 10.0.2.2; the iOS simulator shares the host,
#     so it uses localhost. The suite's API/UI checks (on the host) always use localhost.
#
# WHY SEPARATE (not in playwright.yml): it needs Android emulators AND macOS iOS simulators and
# builds 4 phone apps — too heavy to put on every PR.
#
# TRIGGERS
#   - repository_dispatch (mobile-sdk-release): the real "SDK changed" signal (SDK lives in other
#     repos; each must dispatch here on release — see docs/CI-NOTES.md).
#   - pull_request touching tests/mobile-testing/** or this file → preflight only.
#   - workflow_dispatch → manual; run_full_suite=true to build apps + drive devices.
#
# FIRST-RUN SHAKEOUT (authored but not yet executed on GitHub runners — see docs/CI-NOTES.md):
#   the OpenObserve image/binary pin, the /rumtoken response shape, and iOS ATS (cleartext to
#   localhost) may need tuning on the first real run.
# =============================================================================================
name: Mobile RUM SDK E2E

on:
  repository_dispatch:
    types: [mobile-sdk-release]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Build apps + drive emulator/simulator (OFF = preflight only)"
        type: boolean
        default: false
      platforms:
        description: "Which device jobs to run when full suite is on"
        type: choice
        options: [both, android, ios]
        default: both
      sdk:
        description: "Override one SDK to test its latest version (else the committed pin is used)"
        type: choice
        options: [none, react-native, android, ios]
        default: none
      sdk_version:
        description: "SDK version to test (used with 'sdk' above)"
        type: string
        default: ""
  pull_request:
    # `labeled` so adding the 'mobile-e2e' label re-fires the run and turns the device jobs on
    # (lets you validate the full Android + iOS suite on a PR before merging).
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "tests/mobile-testing/**"
      - ".github/workflows/mobile-sdk-e2e.yml"
  # schedule:
  #   - cron: "0 2 * * 1" # Mondays 02:00 UTC — weekly safety net

concurrency:
  group: mobile-sdk-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Non-secret defaults for a fresh local OpenObserve (identical to the other test workflows).
  ZO_ROOT_USER_EMAIL: root@example.com
  ZO_ROOT_USER_PASSWORD: Complexpass#123
  OO_USER: root@example.com
  OO_PASS: "Complexpass#123"
  OO_ORG: default
  # Placeholder so config.js (which requires OO_URL) loads during preflight `--list`; the device
  # jobs override this via $GITHUB_ENV with their own on-runner instance.
  OO_URL: http://localhost:5080
  # OpenObserve to run on the runner. Pin these once the first run is green.
  OO_IMAGE: public.ecr.aws/zinclabs/openobserve:latest

jobs:
  # -------------------------------------------------------------------------------------------
  # PREFLIGHT — always runs, no devices. Validates the suite compiles and prints a readiness note.
  # Self-contained model → no secrets to check.
  # -------------------------------------------------------------------------------------------
  preflight:
    name: Preflight & readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      suite_ok: ${{ steps.validate.outputs.suite_ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install suite dependencies
        working-directory: tests/mobile-testing
        run: npm ci || npm install

      - name: Validate the suite parses (playwright --list)
        id: validate
        working-directory: tests/mobile-testing
        run: |
          set +e
          LIST=$(npx playwright test --list 2>&1); CODE=$?
          echo "$LIST" | tail -3
          TOTAL=$(echo "$LIST" | grep -Eo 'Total: [0-9]+ tests' | grep -Eo '[0-9]+' | head -1)
          [ $CODE -eq 0 ] && echo "suite_ok=true" >> "$GITHUB_OUTPUT" || echo "suite_ok=false" >> "$GITHUB_OUTPUT"
          echo "TOTAL_TESTS=${TOTAL:-0}" >> "$GITHUB_ENV"

      - name: Readiness summary
        run: |
          {
            echo "## Mobile RUM SDK E2E — readiness"
            echo ""
            echo "Suite parsed: **${{ steps.validate.outputs.suite_ok }}** (${TOTAL_TESTS:-?} tests, 4 platforms)"
            echo ""
            echo "| Item | Status | Notes |"
            echo "|---|---|---|"
            echo "| Suite compiles | ${{ steps.validate.outputs.suite_ok == 'true' && '✅ ok' || '❌ fail' }} | gates device jobs |"
            echo "| Secrets required | ✅ none | self-contained: each run builds its own OpenObserve |"
            echo "| Android runner | ✅ Linux + KVM | own instance via 10.0.2.2 |"
            echo "| iOS runner | ⚠️ macOS | free on this public repo; own instance via localhost |"
            echo ""
            echo "> Device jobs run only on \`workflow_dispatch\` (run_full_suite=true) or a \`mobile-sdk-release\` dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the suite does not compile
        if: steps.validate.outputs.suite_ok != 'true'
        run: echo "::error::mobile-testing suite failed to parse" && exit 1

  # -------------------------------------------------------------------------------------------
  # ANDROID — own OpenObserve via Docker; app posts to 10.0.2.2, suite queries localhost.
  # -------------------------------------------------------------------------------------------
  android:
    name: Android (rn-android + android-native)
    needs: preflight
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_suite &&
       (inputs.platforms == 'both' || inputs.platforms == 'android')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'mobile-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Test the LATEST SDK on a release event: the mobile-sdk-release dispatch carries {sdk, version};
      # a manual run can also override via the sdk/sdk_version inputs. Unset → committed pin (reproducible).
      - name: Resolve SDK version override
        run: |
          SDK=''; VER=''
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SDK='${{ github.event.client_payload.sdk }}'; VER='${{ github.event.client_payload.version }}'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SDK='${{ inputs.sdk }}'; VER='${{ inputs.sdk_version }}'
          fi
          [ -z "$VER" ] && { echo "no SDK override — using committed pins"; exit 0; }
          case "$SDK" in
            ios) echo "O2_IOS_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            android) echo "O2_ANDROID_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            react-native|rn) echo "O2_RN_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            *) echo "no SDK override" ;;
          esac

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start OpenObserve + mint RUM token
        run: |
          docker run -d --name oo -p 5080:5080 \
            -e ZO_ROOT_USER_EMAIL="$ZO_ROOT_USER_EMAIL" \
            -e ZO_ROOT_USER_PASSWORD="$ZO_ROOT_USER_PASSWORD" \
            "$OO_IMAGE"
          for i in $(seq 1 60); do curl -sf http://localhost:5080/healthz && break || sleep 2; done
          # GET (not POST): POST /rumtoken ROTATES the token each call; the default org already has
          # a token at creation, so GET reads the stable one the app must match. Validated locally.
          TOKEN=$(curl -s -u "$ZO_ROOT_USER_EMAIL:$ZO_ROOT_USER_PASSWORD" \
            http://localhost:5080/api/default/rumtoken | jq -r '.data.rum_token // .rum_token // .token // empty')
          [ -z "$TOKEN" ] && TOKEN="ci-rum-token"   # ingestion tolerates a static token; refine after first run
          {
            echo "O2_RUM_HOST=http://localhost:5080"
            echo "O2_RUM_ORG=default"
            echo "O2_RUM_TOKEN=$TOKEN"
            echo "O2_RUM_ENV=testing"
            echo "OO_URL=http://localhost:5080"
          } >> "$GITHUB_ENV"

      - name: Install suite deps
        working-directory: tests/mobile-testing
        run: npm ci || npm install

      # RN app: npm ci runs postinstall → patch-sdk + gen-config (writes rum.config.json from O2_RUM_*).
      - name: Build RN-Android APK
        working-directory: tests/mobile-testing/apps/o2-rum-tester
        run: |
          if [ -n "$O2_RN_SDK_VERSION" ]; then
            npm install "@openobserve/mobile-react-native@$O2_RN_SDK_VERSION" \
                        "@openobserve/mobile-react-native-session-replay@$O2_RN_SDK_VERSION"
          else
            npm ci || npm install
          fi
          # Release build: embeds the JS bundle (Debug loads it from the Metro dev server, which
          # isn't running in CI → blank screen). The release buildType is debug-signed in the RN
          # template, so it installs on the emulator without a real keystore.
          (cd android && ./gradlew --no-daemon assembleRelease)

      # Native app: gradle reads O2_RUM_* via System.getenv into BuildConfig. No wrapper committed →
      # use the setup-gradle `gradle`.
      - name: Build Android-native APK
        working-directory: tests/mobile-testing/apps/o2-native-android
        run: gradle --no-daemon assembleDebug

      - name: Boot emulator, install apps, run suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # NB: the emulator-runner executes each line in a SEPARATE shell, so `cd` does not persist —
          # the test command must chain `cd && npx` on one line.
          script: |
            adb reverse tcp:5080 tcp:5080
            adb install -r tests/mobile-testing/apps/o2-rum-tester/android/app/build/outputs/apk/release/app-release.apk
            adb install -r tests/mobile-testing/apps/o2-native-android/app/build/outputs/apk/debug/app-debug.apk
            cd tests/mobile-testing && npx playwright test --project=rn-android --project=android-native

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-android
          path: tests/mobile-testing/playwright-report
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------------
  # iOS — own OpenObserve via the macOS release binary; app + suite both use localhost (sim shares
  # the host network). Runs in PARALLEL with android (separate instance). Alternatives to hosted
  # macOS runners are all still macOS (self-hosted / BrowserStack / Sauce).
  # -------------------------------------------------------------------------------------------
  ios:
    name: iOS (rn-ios + ios-native)
    needs: preflight
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_suite &&
       (inputs.platforms == 'both' || inputs.platforms == 'ios')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'mobile-e2e'))
    # macos-15 ships Xcode 16.x (RN 0.75-compatible + still includes the Swift compatibility libs the
    # SDK references). macos-latest moved to Xcode 26, which removed libswiftCompatibility56 → link error.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SDK version override
        run: |
          SDK=''; VER=''
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SDK='${{ github.event.client_payload.sdk }}'; VER='${{ github.event.client_payload.version }}'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SDK='${{ inputs.sdk }}'; VER='${{ inputs.sdk_version }}'
          fi
          [ -z "$VER" ] && { echo "no SDK override — using committed pins"; exit 0; }
          case "$SDK" in
            ios) echo "O2_IOS_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            android) echo "O2_ANDROID_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            react-native|rn) echo "O2_RN_SDK_VERSION=$VER" >> "$GITHUB_ENV" ;;
            *) echo "no SDK override" ;;
          esac

      # Pin Xcode so a runner-image update can't silently move the toolchain under the alpha SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin 16.4 explicitly: macos-15's 'latest-stable' is now Xcode 26, which dropped the Swift
          # compatibility libs the SDK's static libs force-load → arm64 link error. 16.x still ships them.
          xcode-version: "16.4"
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install Maestro + xcodegen + watchman
        run: |
          brew install watchman xcodegen jq || true
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start OpenObserve (macOS binary) + mint RUM token
        run: |
          A=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo amd64)
          URL=$(curl -s https://api.github.com/repos/openobserve/openobserve/releases/latest \
            | jq -r ".assets[].browser_download_url" | grep -E "darwin-${A}.tar.gz$" | head -1)
          curl -sL "$URL" -o oo.tar.gz && tar xzf oo.tar.gz
          ZO_DATA_DIR="$PWD/oo-data" ./openobserve > oo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/healthz && break || sleep 2; done
          # GET (not POST): POST /rumtoken ROTATES the token each call; the default org already has
          # a token at creation, so GET reads the stable one the app must match. Validated locally.
          TOKEN=$(curl -s -u "$ZO_ROOT_USER_EMAIL:$ZO_ROOT_USER_PASSWORD" \
            http://localhost:5080/api/default/rumtoken | jq -r '.data.rum_token // .rum_token // .token // empty')
          [ -z "$TOKEN" ] && TOKEN="ci-rum-token"
          {
            echo "O2_RUM_HOST=http://localhost:5080"
            echo "O2_RUM_ORG=default"
            echo "O2_RUM_TOKEN=$TOKEN"
            echo "O2_RUM_ENV=testing"
            echo "OO_URL=http://localhost:5080"
          } >> "$GITHUB_ENV"

      - name: Install suite deps
        working-directory: tests/mobile-testing
        run: npm ci || npm install

      - name: Boot an iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          xcrun simctl boot "$UDID" || true
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # RN iOS: npm ci runs gen-config (rum.config.json → localhost). Allow cleartext to localhost
      # for App Transport Security (CI-only plist tweak; committed source stays HTTPS).
      - name: Build + install RN-iOS app
        working-directory: tests/mobile-testing/apps/o2-rum-tester
        run: |
          if [ -n "$O2_RN_SDK_VERSION" ]; then
            npm install "@openobserve/mobile-react-native@$O2_RN_SDK_VERSION" \
                        "@openobserve/mobile-react-native-session-replay@$O2_RN_SDK_VERSION"
          else
            npm ci || npm install
          fi
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/O2RumTester/Info.plist || true
          (cd ios && pod install)
          # Release: embeds the JS bundle (Debug expects the Metro dev server → blank screen in CI).
          # Simulator builds need no code signing.
          xcodebuild -workspace ios/O2RumTester.xcworkspace -scheme O2RumTester \
            -configuration Release -sdk iphonesimulator -destination "id=$IOS_SIM_UDID" \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$IOS_SIM_UDID" ios/build/Build/Products/Release-iphonesimulator/O2RumTester.app

      # iOS-native: gen-config.sh writes GeneratedConfig.swift (localhost) before xcodegen.
      - name: Build + install iOS-native app
        working-directory: tests/mobile-testing/apps/o2-native-ios
        run: |
          if [ -n "$O2_IOS_SDK_VERSION" ]; then
            sed -i '' "s/exactVersion:.*/exactVersion: $O2_IOS_SDK_VERSION/" project.yml
          fi
          O2_RUM_HOST="$O2_RUM_HOST" O2_RUM_ORG="$O2_RUM_ORG" O2_RUM_TOKEN="$O2_RUM_TOKEN" O2_RUM_ENV="$O2_RUM_ENV" bash gen-config.sh
          xcodegen generate
          xcodebuild -project O2NativeIOS.xcodeproj -scheme O2NativeIOS \
            -configuration Debug -sdk iphonesimulator -destination "id=$IOS_SIM_UDID" \
            -derivedDataPath build build
          xcrun simctl install "$IOS_SIM_UDID" build/Build/Products/Debug-iphonesimulator/O2NativeIOS.app

      - name: Run iOS suite
        working-directory: tests/mobile-testing
        run: npx playwright test --project=rn-ios --project=ios-native

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-ios
          path: tests/mobile-testing/playwright-report
          if-no-files-found: ignore
