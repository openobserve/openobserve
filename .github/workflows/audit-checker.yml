name: Security audit
on:
  # Advisories only matter when the dependency set changes, so PR runs are path-filtered to the
  # Cargo manifests; the weekly run catches advisories published against unchanged deps.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit-checker.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A label that changes nothing here skips every job, so it must neither replace nor queue behind a real run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && !contains(fromJSON('["ready-for-ci"]'), github.event.label.name)) && '-mirror' || '' }}
  cancel-in-progress: true

jobs:
  security_audit:
    # Nothing runs on a PR without the 'ready-for-ci' label, or on a draft; ci-gate alone reports the state.
    # Other labels change nothing here, so they skip it; this is not a required check.
    if: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && github.event.pull_request.draft == false)) && !(contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && !contains(fromJSON('["ready-for-ci"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/github-auth
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-audit
      - name: run cargo audit
        run: cargo audit
