name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - name: Check for self-triggered run
        id: self-trigger
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          skip=false
          if [ "$PR_AUTHOR" = "skyramp-testbot[bot]" ]; then
            skip=true
            echo "::notice::PR authored by skyramp-testbot[bot] — skipping the SUT build."
          elif [ -n "$HEAD_SHA" ] && [ "$ACTION" = "synchronize" ]; then
            name=$(git log -1 --pretty=format:%an "$HEAD_SHA" 2>/dev/null || echo "")
            email=$(git log -1 --pretty=format:%ae "$HEAD_SHA" 2>/dev/null || echo "")
            subject=$(git log -1 --pretty=format:%s "$HEAD_SHA" 2>/dev/null || echo "")
            echo "Head commit $HEAD_SHA by '${name}' <${email}>: ${subject}"
            if [ "$name" = "Skyramp Testbot" ] && [ "$email" = "test-bot@skyramp.dev" ]; then
              skip=true
              echo "::notice::Head commit is a testbot autocommit — skipping the SUT build."
            elif printf '%s' "$subject" | grep -Eq '^Merge pull request #[0-9]+ from [^/]+/skyramp-testbot/pr-[0-9]+$'; then
              skip=true
              echo "::notice::Head commit merges a testbot branch — skipping the SUT build."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Build the binary here rather than in the SUT setup script: Rust nightly + npm
      # takes ~30-45 min, which does not fit the setup step's time budget.

      - name: Remove unused tools (free disk space)
        if: steps.self-trigger.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Rust Toolchain
        if: steps.self-trigger.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-20
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust Cache
        if: steps.self-trigger.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: skyramp-testbot-release-ci

      - name: Install Protoc
        if: steps.self-trigger.outputs.skip != 'true'
        run: bash ./.github/protoc.sh

      - name: Setup Node.js
        if: steps.self-trigger.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install UI test-support dependencies
        if: steps.self-trigger.outputs.skip != 'true'
        run: cd tests/ui-testing && (npm ci || npm install)

      - name: Build binary and frontend
        if: steps.self-trigger.outputs.skip != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GIT_HASH_OVERRIDE: ${{ github.sha }}
        run: |
          mkdir -p /tmp/dist
          bash -c "cd web && npm ci && npm run build && cp -r ./dist/. /tmp/dist/" &
          NPM_PID=$!
          sed -i 's|folder = "../../web/dist/"|folder = "/tmp/dist/"|' src/web/src/lib.rs && grep -q 'folder = "/tmp/dist/"' src/web/src/lib.rs
          cargo build --profile release-ci --target x86_64-unknown-linux-gnu
          wait $NPM_PID
          test -f /tmp/dist/index.html
          sed -i 's|folder = "/tmp/dist/"|folder = "../../web/dist/"|' src/web/src/lib.rs && grep -q 'folder = "../../web/dist/"' src/web/src/lib.rs

      - name: Stage binary for SUT startup
        if: steps.self-trigger.outputs.skip != 'true'
        run: |
          mkdir -p release-ci-binary
          cp target/x86_64-unknown-linux-gnu/release-ci/openobserve release-ci-binary/openobserve

      # ── Testbot action ────────────────────────────────────────────────────────

      - uses: skyramp/testbot@87752cf8ab396b6aa73c47069e79834bd1c75eda # v0.11.5
        env:
          SKYRAMP_FEATURE_POM_REUSE: '1'
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          sutSetupMode: 'none'
          sutSourceWorkflowFile: '.github/workflows/playwright.yml'
          targetSetupCommand: 'bash .skyramp/sut/setup.sh'
          targetReadyCheckCommand: 'curl -sf http://localhost:5080/healthz'
          targetReadyCheckTimeout: '300'
          targetReadyCheckDiagnosticsCommand: 'echo "=== o2 log ===" && tail -50 /tmp/o2.log 2>/dev/null || true'
          targetTeardownCommand: 'bash .skyramp/sut/teardown.sh'
          authTokenCommand: 'bash .skyramp/sut/get-auth-token.sh'
          uiCredentials: 'root@example.com:Complexpass#123'
