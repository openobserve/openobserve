name: Isolated pool sample proof
on:
  push:
    branches: [bench/ui-pool-proof-20261101]
    paths:
      - .github/workflows/ui-pool-proof.yml
      - .github/ui-pool-proof/**
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'openobserve/openobserve' && !github.event.repository.private
    runs-on: ubicloud-standard-8
    timeout-minutes: 12
    env:
      TZ: UTC
    steps:
      - name: Start job budget
        shell: bash
        run: |
          echo "PROOF_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pool-evidence" "$RUNNER_TEMP/pool-artifact"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify pinned web tree
        timeout-minutes: 1
        shell: bash
        run: |
          python3 .github/ui-pool-proof/run-proof.py --web "$GITHUB_WORKSPACE/web" --verify-source > "$RUNNER_TEMP/pool-evidence/source-verification.json"
          uname -a > "$RUNNER_TEMP/pool-evidence/host.txt"
          lscpu >> "$RUNNER_TEMP/pool-evidence/host.txt"
          free -m >> "$RUNNER_TEMP/pool-evidence/host.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: One locked dependency install
        timeout-minutes: 3
        working-directory: web
        shell: bash
        run: |
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
          /usr/bin/time -v -o "$RUNNER_TEMP/pool-evidence/install.resources.txt" timeout --signal=TERM --kill-after=5s 165s npm ci > "$RUNNER_TEMP/pool-evidence/install.log" 2>&1
      - name: Four bounded covered trials
        timeout-minutes: 9
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - PROOF_JOB_STARTED ))
          remaining=$(( 600 - elapsed ))
          if (( remaining > 540 )); then remaining=540; fi
          if (( remaining <= 30 )); then echo "Insufficient trial budget"; exit 1; fi
          timeout --signal=TERM --kill-after=10s "$(( remaining - 10 ))s" python3 .github/ui-pool-proof/run-proof.py --web "$GITHUB_WORKSPACE/web" --output "$RUNNER_TEMP/pool-evidence/proof" --overall-timeout "$remaining" 2>&1 | tee "$RUNNER_TEMP/pool-evidence/proof-driver.log"
      - name: Verify source and record job timing
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          data = {'elapsedSecondsBeforePackaging': time.time() - int(os.environ['PROOF_JOB_STARTED']), 'configuredRunner': 'ubicloud-standard-8', 'actualVmFamily': 'Requires Set up job log review; label alone is insufficient'}
          (Path(os.environ['RUNNER_TEMP']) / 'pool-evidence/job-timing.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          python3 .github/ui-pool-proof/run-proof.py --web "$GITHUB_WORKSPACE/web" --verify-source > "$RUNNER_TEMP/pool-evidence/final-source-verification.json"
      - name: Package bounded evidence
        if: always()
        timeout-minutes: 1
        shell: bash
        run: python3 .github/ui-pool-proof/package-evidence.py "$RUNNER_TEMP/pool-evidence" "$RUNNER_TEMP/pool-artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: pool-sample-${{ github.run_id }}
          path: ${{ runner.temp }}/pool-artifact/
          retention-days: 3
          if-no-files-found: error
