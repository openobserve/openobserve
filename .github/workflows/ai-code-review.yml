name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      force_full:
        description: "Force full review tier (ignore risk assessment)"
        required: false
        type: boolean
        default: false

jobs:
  review:
    # Explicit name: without it GitHub serializes the whole matrix object into the public check
    # name, and the check name is public on every PR.
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Concurrency is per-job (not workflow-level) so it can see `matrix`: keyed per-PR AND
    # per-provider, so provider legs get independent groups and don't cancel each other.
    concurrency:
      group: ai-review-${{ matrix.provider.name }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    strategy:
      # One provider's failure shouldn't sink the others.
      fail-fast: false
      matrix:
        # The provider and model are NOT declared here: this repo is public, and so are its
        # Actions logs. Everything that would name the model comes from secrets (masked in logs)
        # via the "Configure review provider" step below. Only leg-local, non-identifying values
        # live in the matrix. Adding a leg? Give it a distinct `<!-- ai-code-review-<suffix> -->`
        # marker — run-review.mjs matches that shape, so two legs sharing one marker would claim
        # and overwrite each other's comment.
        provider:
          - name: primary
            model_variant: ""
            marker: "<!-- ai-code-review -->"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ai-review/package-lock.json

      - name: Install AI review dependencies
        working-directory: scripts/ai-review
        run: npm ci

      - name: Install opencode
        env:
          # Pinned so an upstream opencode release can't silently change review behavior
          # (agent/tool semantics, prompt handling) underneath this workflow. Bump
          # deliberately after testing against scripts/ai-review locally.
          OPENCODE_VERSION: "1.17.13"
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Set trace ID
        run: echo "O2_TRACE_ID=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Set PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for skip marker
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip_review=false" >> "$GITHUB_OUTPUT"
            echo "force_full=${{ github.event.inputs.force_full || 'false' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check PR body and comments for skip markers
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null || echo "")
          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --jq '.[].body' 2>/dev/null || echo "")

          if echo "$PR_BODY$COMMENTS" | grep -qiE '\[skip (ai )?review\]|\[skip ci\]|break glass'; then
            echo "Skip marker found. Skipping AI review."
            echo "skip_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_review=false" >> "$GITHUB_OUTPUT"
          fi
          echo "force_full=false" >> "$GITHUB_OUTPUT"

      # Mint a GitHub App installation token so the review comment is authored by the
      # "OpenObserve Code Reviewer" app (branded name + avatar) instead of github-actions[bot].
      # Gated on the OO_REVIEWER_APP_ID repo/org variable: if the app isn't configured the step is
      # skipped. `continue-on-error` makes it fail-safe even when the variable IS set but the app
      # isn't installed yet (or the key is wrong): minting fails, the token output is empty, and
      # the run step's `|| github.token` fallback posts as github-actions[bot] instead of breaking
      # CI. So this is safe at every rollout stage; it auto-activates once the app is installed and
      # OO_REVIEWER_APP_ID + OO_REVIEWER_APP_PRIVATE_KEY are provisioned.
      - name: Generate OpenObserve Code Reviewer app token
        id: app_token
        if: ${{ steps.skip.outputs.skip_review == 'false' && vars.OO_REVIEWER_APP_ID != '' }}
        continue-on-error: true
        # Pinned to a full commit SHA (not a mutable tag) because this action receives the app's
        # signing private key — a repointed/compromised release could exfiltrate it. Same pin
        # discipline as OPENCODE_VERSION above. Bump deliberately after review.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OO_REVIEWER_APP_ID }}
          private-key: ${{ secrets.OO_REVIEWER_APP_PRIVATE_KEY }}

      # The opencode provider block (endpoint + model id) lives in a secret and is merged over
      # the repo's opencode.jsonc at runtime, so no committed file and no public log names the
      # model. Empty secret ⇒ no overlay: run-review.mjs then reports a misconfiguration.
      - name: Configure review provider
        if: steps.skip.outputs.skip_review == 'false'
        env:
          REVIEW_OPENCODE_CONFIG: ${{ secrets.REVIEW_OPENCODE_CONFIG }}
        run: |
          if [ -z "$REVIEW_OPENCODE_CONFIG" ]; then
            echo "REVIEW_OPENCODE_CONFIG is not set; the review will report a misconfiguration."
            exit 0
          fi
          printf '%s' "$REVIEW_OPENCODE_CONFIG" > "$RUNNER_TEMP/opencode-review.json"
          echo "OPENCODE_CONFIG=$RUNNER_TEMP/opencode-review.json" >> "$GITHUB_ENV"

      - name: Run AI Code Review
        if: steps.skip.outputs.skip_review == 'false'
        env:
          # App token when the app is configured (comment posts as OpenObserve Code Reviewer),
          # else github.token (posts as github-actions[bot]). Same engine either way.
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          FORCE_FULL: ${{ steps.skip.outputs.force_full }}
          # Provider and model come from secrets so GitHub masks them in this public log.
          REVIEW_PROVIDER_ID: ${{ secrets.REVIEW_PROVIDER_ID }}
          REVIEW_MODEL_ID: ${{ secrets.REVIEW_MODEL_ID }}
          REVIEW_MODEL_VARIANT: ${{ matrix.provider.model_variant }}
          REVIEW_MARKER: ${{ matrix.provider.marker }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          O2_TRACE_INGEST_URL: ${{ secrets.O2_TRACE_INGEST_URL }}
          O2_TRACE_ORG: ${{ secrets.O2_TRACE_ORG }}
          O2_TRACE_USERNAME: ${{ secrets.O2_TRACE_USERNAME }}
          O2_TRACE_PASSWORD: ${{ secrets.O2_TRACE_PASSWORD }}
          O2_TRACE_AUTH: ${{ secrets.O2_TRACE_AUTH }}
          O2_TRACE_STREAM: ${{ secrets.O2_TRACE_STREAM }}
          O2_TRACE_EXPORT_TIMEOUT_MS: ${{ vars.O2_TRACE_EXPORT_TIMEOUT_MS }}
          O2_TRACE_EXPORT_BATCH_SIZE: ${{ vars.O2_TRACE_EXPORT_BATCH_SIZE }}
        run: node scripts/ai-review/run-review.mjs

      - name: Log skip
        if: steps.skip.outputs.skip_review == 'true'
        run: echo "AI Code Review skipped due to skip marker or break glass"
