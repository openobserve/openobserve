name: Cleanup closed PR caches

on:
  # This event executes the default-branch workflow. No PR-controlled code is
  # checked out or executed while the token has actions:write.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Closed PR number whose merge-ref caches should be deleted"
        required: true
        type: string

concurrency:
  group: cleanup-pr-cache-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches scoped to the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr_state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
            if [ "$pr_state" = "OPEN" ]; then
              echo "::error::Refusing to delete caches for open PR #$PR_NUMBER"
              exit 1
            fi
          fi

          cache_ref="refs/pull/${PR_NUMBER}/merge"
          cache_ids="$(gh cache list --ref "$cache_ref" --limit 100 --json id --jq '.[].id')"
          if [ -z "$cache_ids" ]; then
            echo "No caches found for $cache_ref"
            exit 0
          fi

          deleted=0
          failed=0
          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            if gh cache delete "$cache_id"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Failed to delete cache ID $cache_id"
              failed=$((failed + 1))
            fi
          done <<< "$cache_ids"
          echo "Deleted $deleted cache entries for $cache_ref; failures: $failed"
          [ "$failed" -eq 0 ]
