name: API Bug-Fix Regression Tests

# Bug-fix API tests (tests/regression/) run only here, never on a PR; shards come from tests/api-testing/ci-matrix/ci_matrix_api_regression.json.

on:
  schedule:
    # Offset 1h from the Playwright regression crons so the two do not contend for runners.
    - cron: '30 18 * * *'  # 12:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Mirrors api-testing.yml's env block; the suite asserts against several of these
# (ZO_INGEST_ALLOWED_UPTO gates the backfill tests, ZO_SSRF_ALLOW_LOOPBACK the
# destination tests), so they are not optional decoration.
env:
  COLUMNS: 150
  ZO_ROOT_USER_EMAIL: root@example.com
  ZO_ROOT_USER_PASSWORD: Complexpass#123
  ZO_BASE_URL: http://localhost:5080/
  ZO_BASE_URL_SC: http://localhost:5080/
  WS_ZO_BASE_URL: ws://localhost:5080/
  ZO_USAGE_PUBLISH_INTERVAL: 5
  ZO_ALERT_SCHEDULE_INTERVAL: 3
  ZO_SMTP_ENABLED: true
  ZO_CREATE_ORG_THROUGH_INGESTION: true
  ZO_INGEST_ALLOWED_UPTO: 48  # Allow backdated data ingestion for backfill tests
  ZO_SSRF_ALLOW_LOOPBACK: true  # Allow localhost destinations in API tests

jobs:
  # Skip the whole suite when main has not moved since the last regression run:
  # rebuilding and re-running on identical code is pure waste. Manual dispatch
  # always runs. Same contract as playwright_bugfix_regression.yml.
  check_main_changed:
    timeout-minutes: 5
    name: check_main_changed
    runs-on: ubuntu-latest
    permissions:
      actions: read  # for `gh run list` (last run's head_sha)
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repo from --repo, GH_REPO, then the git remote — it does NOT
          # read GITHUB_REPOSITORY. This job has no checkout, so without GH_REPO every
          # `gh run list` fails, LAST_SHA stays empty and the gate falls through to "run".
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual dispatch — running regardless of main changes."
            exit 0
          fi
          # On a scheduled run github.sha is main's tip, so no checkout is needed.
          CURRENT_SHA="${{ github.sha }}"
          # head_sha of the most recent completed previous run of THIS workflow on main,
          # excluding the current run. On any failure LAST_SHA stays empty and we fall
          # through to should_run=true (fail-safe: run rather than skip).
          LAST_SHA=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch main \
            --limit 50 \
            --json databaseId,headSha,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status == \"completed\")] | .[0].headSha" \
            2>/dev/null || echo "")
          if [ -z "$LAST_SHA" ]; then
            echo "::warning::Could not determine last run SHA (no prior completed run, or gh query failed) — defaulting to run."
          fi
          echo "Current main SHA: ${CURRENT_SHA:-<none>}"
          echo "Last run SHA:     ${LAST_SHA:-<none>}"
          if [ -n "$LAST_SHA" ] && [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main unchanged since last regression run ($CURRENT_SHA) — skipping."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build_api_binary:
    timeout-minutes: 60
    name: build_api_binary
    needs: [check_main_changed]
    if: ${{ needs.check_main_changed.outputs.should_run == 'true' }}
    runs-on: ubicloud-standard-4
    env:
      # CI executes a stripped binary; omitting dependency debuginfo keeps the
      # shared compile cache small while preserving dev-profile debug assertions.
      CARGO_PROFILE_DEV_DEBUG: "0"
    permissions:
      contents: read
    steps:
      - name: Remove unused tools
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout git repo
        uses: actions/checkout@v5

      - uses: ./.github/actions/github-auth
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-24

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Read the same dependency cache api-testing.yml reads; the DB workflow's
          # push:main build is the only writer, so this job never saves.
          shared-key: backend-debug0-mimalloc-deps-v1
          add-job-id-key: false
          save-if: false

      - name: Install Protoc
        run: bash ./.github/protoc.sh

      - name: Build OpenObserve debug binary
        run: cargo build --features mimalloc

      - name: Package OpenObserve debug binary
        run: |
          strip target/debug/openobserve
          tar -C target/debug -czf openobserve-api-debug.tar.gz openobserve

      - name: Upload OpenObserve debug binary
        uses: actions/upload-artifact@v4
        with:
          name: openobserve-api-debug-${{ github.sha }}
          path: openobserve-api-debug.tar.gz
          if-no-files-found: error
          retention-days: 3
          # The payload is already gzip-compressed; avoid a second compression pass.
          compression-level: 0

  # Runs beside the build, so a bad manifest or an unwired regression test fails in seconds, not after a cold compile.
  generate_matrix:
    name: generate_matrix
    timeout-minutes: 5
    needs: [check_main_changed]
    if: ${{ needs.check_main_changed.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: |
          MATRIX=$(python3 .github/scripts/build-api-regression-matrix.py \
            tests/api-testing/ci-matrix/ci_matrix_api_regression.json \
            tests/api-testing)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq -r '"generated \(.include | length) shards: \([.include[].label] | join(", "))"'

  api_regression_tests:
    timeout-minutes: 60
    name: "api_regression / ${{ matrix.label }}"
    needs: [check_main_changed, build_api_binary, generate_matrix]
    if: ${{ needs.check_main_changed.outputs.should_run == 'true' }}
    runs-on: eks-openobserve-standard-4
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.matrix) }}
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v5

      - name: Download OpenObserve debug binary
        uses: actions/download-artifact@v5
        with:
          name: openobserve-api-debug-${{ github.sha }}
          path: api-binary-artifact

      - name: Extract OpenObserve debug binary
        run: |
          mkdir -p target/debug
          tar -xzf api-binary-artifact/openobserve-api-debug.tar.gz -C target/debug
          chmod +x target/debug/openobserve

      - name: Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.11.6"

      - name: Setup rye
        uses: eifinger/setup-rye@c694239a43768373e87d0103d7f547027a23f3c8 # v4.2.9
        env:
          # Reuse setup-python's interpreter so `rye self install` skips the flaky toolchain download.
          RYE_TOOLCHAIN: ${{ steps.setup-python.outputs.python-path }}
        with:
          enable-cache: true
          working-directory: "tests/api-testing/"
          version: "0.27.0"

      - name: Pin cpython
        run: rye pin cpython@3.11.6
        working-directory: tests/api-testing/

      - name: Rye sync
        run: rye sync
        working-directory: tests/api-testing/

      - name: "Run ${{ matrix.label }}"
        # --force-sugar omitted on purpose: pytest-sugar auto-loads via its entry
        # point, and passing the flag registers it twice and inflates the counter.
        env:
          SERVER_ENV: ${{ matrix.server_env }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          read -ra pairs <<< "$SERVER_ENV"
          read -ra args <<< "$TARGET"
          env "${pairs[@]}" "$GITHUB_WORKSPACE/target/debug/openobserve" > "o2_$LABEL.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5080/healthz > /dev/null 2>&1; then
              echo "Server ready after ${i}s"; break
            fi
            sleep 1
          done
          rye run pytest "${args[@]}" -v --junitxml="junit-$LABEL.xml"
          kill $SERVER_PID || true
        working-directory: tests/api-testing/

      # Artifact name is a contract: parse-api-junit.py reads the CATEGORY from the
      # part between the `__`s, and collapses legs that re-run the same tests.
      - name: Upload API junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit__${{ matrix.category }}__${{ matrix.label }}
          path: tests/api-testing/junit-${{ matrix.label }}.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload OpenObserve server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openobserve-${{ matrix.label }}-log
          path: tests/api-testing/o2_${{ matrix.label }}.log
          if-no-files-found: warn
          retention-days: 14

  api_regression_summary:
    name: api_regression_summary
    needs: [check_main_changed, build_api_binary, generate_matrix, api_regression_tests]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check_main_changed.outputs.should_run }}" != "true" ]; then
            echo "✅ main unchanged since the last run — nothing to verify."
            exit 0
          fi
          if [ "${{ needs.build_api_binary.result }}" == "success" ] && \
             [ "${{ needs.generate_matrix.result }}" == "success" ] && \
             [ "${{ needs.api_regression_tests.result }}" == "success" ]; then
            echo "✅ All API regression legs passed"
            exit 0
          fi
          echo "API regression failed: build=${{ needs.build_api_binary.result }}, matrix=${{ needs.generate_matrix.result }}, tests=${{ needs.api_regression_tests.result }}"
          exit 1

  # GitHub emails assignees and @-mentioned users, so a tracking issue is the
  # notification: one open issue per breakage, a comment per further failing run,
  # closed by the next green run. Its own label so it never closes the Playwright one.
  report_result:
    name: Report result
    needs: [check_main_changed, api_regression_tests, api_regression_summary]
    # Gated on the GATE, not on the test job: a failed build_api_binary skips
    # api_regression_tests, and keying off that would turn the loudest failure
    # mode into silence. should_run tells "nothing to do" apart from "it broke".
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.check_main_changed.outputs.should_run == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: ci-api-regression-failure
      NOTIFY: hengfeiyang,oasisk,Shrinath-O2,neha00290,vamsikarthikr
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.api_regression_summary.result }}
    steps:
      - name: Open or update the failure issue, or close it on green
        run: |
          OPEN=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // ""')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "API regression is green again on main (${{ github.sha }}): $RUN_URL"
            fi
            exit 0
          fi
          FAILED=$(gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("api_regression /")) | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")')
          MENTIONS=$(echo "$NOTIFY" | sed 's/[^,]*/@&/g; s/,/ /g')
          BODY="API regression failed on main at ${{ github.sha }}.
          Failed legs: ${FAILED:-none listed (build, matrix or summary failed)}
          Run: $RUN_URL

          $MENTIONS"
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh label create "$LABEL" --color B60205 --description "Scheduled API regression on main is failing" 2>/dev/null || true
            gh issue create --title "API regression failing on main" --label "$LABEL" --assignee "$NOTIFY" --body "$BODY"
          fi

  # Non-fatal metrics sidecar: ci_regression and ci_regression_shards, as the UI regression reports; never fails the run.
  report_to_openobserve:
    name: Report run metrics to OpenObserve
    needs: [check_main_changed, api_regression_tests, api_regression_summary]
    if: ${{ always() && needs.check_main_changed.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Clone the current repo
        uses: actions/checkout@v5

      # NO merge-multiple: each artifact must land in its own subdir so the parser
      # can read the category from the dir name. Missing artifacts are non-fatal.
      - name: Download API junit reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: api-junit__*
          path: junit-xml

      - name: Report run metrics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          O2_REPORTING_INGEST_BASE: ${{ secrets.O2_REPORTING_INGEST_BASE }}
          O2_REPORTING_AUTH: ${{ secrets.O2_REPORTING_AUTH }}
          O2_REPORTING_INSECURE: ${{ vars.O2_REPORTING_INSECURE }}
          BUILD_JOB_NAME: build_api_binary
          SHARD_PREFIX: "api_regression / "
          # The summary, not the test job: a failed build skips the tests, and skipped must not read as green.
          RESULT: ${{ needs.api_regression_summary.result }}
        run: |
          set -uo pipefail
          if [ "$RESULT" = "success" ]; then CONCLUSION=success
          elif [ "$RESULT" = "cancelled" ]; then CONCLUSION=cancelled
          else CONCLUSION=failure; fi
          # MIRROR_STREAM also lands the run in ci_test_runs, so the run-health dashboard can pick suite=api_regression like UI regression.
          export CONCLUSION STREAM=ci_regression SUITE=api_regression MIRROR_STREAM=ci_test_runs
          EXTRA_JSON=""
          if [ -d junit-xml ]; then
            COUNTS=$(python3 .github/scripts/parse-api-junit.py junit-xml 2>/dev/null || echo "")
            if [ -n "$COUNTS" ] && printf '%s' "$COUNTS" | jq -e . >/dev/null 2>&1; then
              echo "API counts: $COUNTS"
              EXTRA_JSON=$(printf '%s' "$COUNTS" | jq -c .total 2>/dev/null || echo "")
              printf '%s' "$COUNTS" | jq -c --arg run_id "$GITHUB_RUN_ID" --arg repo "$GITHUB_REPOSITORY" \
                '[.by_category[] | {run_id:$run_id, repo:$repo, suite:"api_regression", workflow:"regression", ingest_source:"live",
                  module:.module, tests_total, tests_passed, tests_failed, tests_flaky, tests_skipped}]' > api_counts_rows.json
              if [ "$(jq 'length' api_counts_rows.json 2>/dev/null || echo 0)" -gt 0 ]; then
                bash .github/scripts/o2-report.sh ci_test_counts api_counts_rows.json
              fi
            fi
          fi
          export EXTRA_JSON
          bash .github/scripts/o2-run-report.sh
