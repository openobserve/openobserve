[package]
name = "openobserve-api-pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
enterprise = [
    "dep:o2_enterprise",
    "dep:o2_openfga",
    "openobserve-http-common/enterprise",
    "openobserve-core/enterprise",
    "search_service/enterprise",
    "enrichment-data/enterprise",
    "stream/enterprise",
]
cloud = [
    "enterprise",
    "o2_enterprise/cloud",
    "openobserve-http-common/cloud",
    "openobserve-core/cloud",
    "stream/cloud",
]
vectorscan = [
    "openobserve-core/vectorscan",
    "search_service/vectorscan",
    "stream/vectorscan",
]

[dependencies]
ahash.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
common.workspace = true
config.workspace = true
db.workspace = true
enrichment-data.workspace = true
hashbrown.workspace = true
infra.workspace = true
log.workspace = true
o2_enterprise = { workspace = true, optional = true, default-features = false }
o2_openfga = { workspace = true, optional = true }
openobserve-http-common.workspace = true
openobserve-builtins.workspace = true
openobserve-core.workspace = true
search_service.workspace = true
serde.workspace = true
serde_json.workspace = true
stream.workspace = true
tracing.workspace = true
transform.workspace = true
url.workspace = true
utoipa.workspace = true
