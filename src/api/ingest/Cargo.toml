[package]
name = "openobserve-api-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
enterprise = [
    "dep:o2_dex",
    "dep:o2_enterprise",
    "dep:o2_openfga",
    "openobserve-http-common/enterprise",
    "openobserve-core/enterprise",
    "promql-service/enterprise",
    "search_service/enterprise",
    "enrichment-data/enterprise",
    "stream/enterprise",
]
cloud = [
    "enterprise",
    "o2_enterprise/cloud",
    "openobserve-core/cloud",
    "openobserve-http-common/cloud",
    "stream/cloud",
]
vectorscan = [
    "openobserve-core/vectorscan",
    "promql-service/vectorscan",
    "search_service/vectorscan",
    "stream/vectorscan",
]

[dependencies]
anyhow.workspace = true
arrow-schema.workspace = true
audit.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
common.workspace = true
config.workspace = true
datafusion.workspace = true
db.workspace = true
enrichment-data.workspace = true
flate2.workspace = true
hashbrown.workspace = true
infra.workspace = true
ingester.workspace = true
ingestion-common.workspace = true
itertools.workspace = true
log.workspace = true
o2_dex = { workspace = true, optional = true }
o2_enterprise = { workspace = true, optional = true, default-features = false }
o2_openfga = { workspace = true, optional = true }
openobserve-http-common.workspace = true
openobserve-core.workspace = true
openobserve-node.workspace = true
opentelemetry-proto.workspace = true
promql-service.workspace = true
prost.workspace = true
proto.workspace = true
search.workspace = true
search_service.workspace = true
serde.workspace = true
serde_json.workspace = true
snap.workspace = true
stream.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
transform.workspace = true
utoipa.workspace = true
