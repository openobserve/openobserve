[package]
name = "openobserve-synthetics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# `o2_enterprise` is a one-way edge: this crate publishes super-cluster messages
# through it, and the private-agent code over there must therefore NOT depend on
# this crate — cargo rejects the package cycle outright, `optional` and feature
# gating included. Anything both sides need lives in `config` or `infra`.
enterprise = ["dep:o2_enterprise", "dep:o2_openfga"]
# `cloud` ⇒ `enterprise`, never the reverse (spec §8.1): a self-hosted
# Enterprise build has `enterprise` and not `cloud`. Same shape every sibling
# crate uses. Without this feature every `#[cfg(feature = "cloud")]` written in
# this crate compiled to nothing, silently — F6.
# `infra/cloud` is what makes `OrganizationRecord::trial_ends_at` exist — the
# trial gate reads it. `src/core` forwards it the same way; the sibling
# crates that omit it get it transitively through `openobserve-core/cloud`,
# which this crate does not depend on.
cloud = ["enterprise", "infra/cloud", "o2_enterprise/cloud"]

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-lambda.workspace = true
chrono.workspace = true
config.workspace = true
dashmap.workspace = true
infra.workspace = true
log.workspace = true
o2_enterprise = { workspace = true, optional = true, default-features = false }
o2_openfga = { workspace = true, optional = true }
reqwest.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
svix-ksuid.workspace = true
tokio.workspace = true
tracing.workspace = true
urlencoding.workspace = true

