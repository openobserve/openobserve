[package]
name = "super_cluster_queue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
enterprise = [
    "dep:anyhow",
    "dep:arrow",
    "dep:async-recursion",
    "dep:bytes",
    "dep:common",
    "dep:config",
    "dep:db",
    "dep:infra",
    "dep:log",
    "dep:o2_enterprise",
    "dep:sea-orm",
    "dep:serde",
    "dep:serde_json",
    "dep:svix-ksuid",
    "dep:tokio",
    "compaction/enterprise",
    "enrichment-data/enterprise",
    "openobserve-core/enterprise",
    "stream/enterprise",
]
vectorscan = [
    "enrichment-data?/vectorscan",
    "o2_enterprise/vectorscan",
    "stream?/vectorscan",
]

[dependencies]
anyhow = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
async-recursion = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
common = { workspace = true, optional = true }
config = { workspace = true, optional = true }
db = { workspace = true, optional = true }
infra = { workspace = true, optional = true }
log = { workspace = true, optional = true }
o2_enterprise = { workspace = true, optional = true, default-features = false }
openobserve-core = { workspace = true, optional = true }
compaction = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
stream = { workspace = true, optional = true }
enrichment-data = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
svix-ksuid = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
