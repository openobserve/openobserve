syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.openobserve.cluster";
option java_outer_classname = "querycacheProto";

package cluster;

service QueryCache {
    rpc DeleteResultCache (DeleteResultCacheRequest) returns (DeleteResultCacheResponse) {}
    // Per-range state of public dashboard links from the querier holding their result files.
    rpc PublicDashboardStatus (PublicDashboardStatusRequest) returns (PublicDashboardStatusResponse) {}
}

message DeleteResultCacheRequest {
    string  path = 1; 
    int64   ts = 2; 
}

message DeleteResultCacheResponse {
    bool deleted = 1;  
}

message PublicDashboardStatusRequest {
    string org_id = 1;
    repeated string link_ids = 2;
    bool with_sources = 3;
}

message PublicDashboardStatusResponse {
    // JSON list of link status reports.
    string reports = 1;
}
