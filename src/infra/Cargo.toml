[package]
name = "infra"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cloud = []
# Exposes `table::test_harness` (the migrated-SQLite test database) to other
# crates' test builds. Never enable it outside [dev-dependencies].
test-utils = ["dep:tempfile"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
arrow.workspace = true
async-recursion.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
config.workspace = true
datafusion.workspace = true
futures.workspace = true
hashbrown.workspace = true
hashlink.workspace = true
itertools.workspace = true
log.workspace = true
async-nats.workspace = true
object_store.workspace = true
parking_lot.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sqlx.workspace = true
svix-ksuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
reqwest.workspace = true
url.workspace = true
tonic.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
proto.workspace = true
# test-utils only (the harness creates its SQLite file in a temp dir); a
# plain build never links it.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
collapse.workspace = true
sea-orm = { workspace = true, features = ["mock"] }
tempfile.workspace = true
