# Drives O2RumTester: one tap writes an info/warn/error burst through O2Logs (the spec asserts _rumlog).
appId: com.o2rumtester
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "O2 RUM Tester"
    timeout: 40000
- scrollUntilVisible:
    element:
      text: "Send logs"
- tapOn: "Send logs"
- assertVisible: "logs sent"
- waitForAnimationToEnd:
    timeout: 3000
