# Drives O2RumTester on iOS: one tap writes an info/warn/error burst through O2Logs (the spec asserts _rumlog).
appId: org.reactjs.native.example.O2RumTester
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "O2 RUM Tester"
    timeout: 40000
- scrollUntilVisible:
    element:
      text: "Send logs"
- tapOn: "Send logs"
- assertVisible: "logs sent"
- waitForAnimationToEnd:
    timeout: 3000
