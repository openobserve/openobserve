# Drives the RN app on iOS through every scenario. appId = iOS bundle id.
appId: org.reactjs.native.example.O2RumTester
---
- launchApp:
    clearState: false
- assertVisible: "O2 RUM Tester"
- tapOn: "Fetch data (success)"
- tapOn: "Fetch data (404 error)"
- tapOn: "Trigger handled error"
- assertVisible: "handled error reported to RUM"
- tapOn: "Go to Details →"
- assertVisible: "Details"
- tapOn: "Custom action (tap)"
- tapOn: "← Back to Home"
- tapOn: "Go to Checkout form →"
- assertVisible: "Checkout (masking test)"
- tapOn: "Place order"
- tapOn: "← Back to Home"
- tapOn: "Trigger native crash"
- waitForAnimationToEnd:
    timeout: 4000
- stopApp
- launchApp
