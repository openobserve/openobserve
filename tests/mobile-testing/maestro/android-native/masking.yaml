appId: com.o2native
---
# Drive to the Checkout form (email + card PII on screen) so Session Replay records it. The app is
# configured MASK_ALL, so none of this text may appear in the replay — the masking test asserts that.
- launchApp:
    clearState: false
- assertVisible: "Go to Checkout"
- tapOn: "Go to Checkout"
- assertVisible: "Checkout (masking test)"
- waitForAnimationToEnd:
    timeout: 4000
