# DBM SERVER-VANTAGE proof rig.
# Distinct compose project + container names + ports from tests/dbm-capture and
# from the dev machine's own stack (o2-postgres:5432, nats, minio, ...).
#   postgres -> dbm-sv-postgres :55432
#   mysql    -> dbm-sv-mysql    :33306
#   redis    -> dbm-sv-redis    :63790
# The collector exports to a REAL OpenObserve on the host (host.docker.internal:5096).
name: dbm-sv

services:
  postgres:
    image: postgres:16
    container_name: dbm-sv-postgres
    command:
      - postgres
      # --- maximum server-vantage observability ---
      - -c
      # COMMA LIST — replacing instead of appending silently kills the entire
      # pg_stat_statements top_query/plans path (auto-explain plan §2.1).
      - shared_preload_libraries=pg_stat_statements,auto_explain
      # --- auto_explain: LAB profile (auto-explain plan §2.3) ---------------
      # log_min_duration=0 logs EVERY statement's executed plan — lab only.
      # log_analyze=on gives real row counts; log_timing=off skips the
      # per-node clock reads (the expensive knob); buffers are free w/ analyze.
      - -c
      - auto_explain.log_min_duration=0
      - -c
      - auto_explain.log_format=json
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_timing=off
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_nested_statements=off
      - -c
      - auto_explain.sample_rate=1.0
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track_utility=on
      - -c
      - track_io_timing=on
      - -c
      - track_functions=all
      - -c
      - track_activity_query_size=4096
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_min_duration_statement=0
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=off
      # log_line_prefix: ISO ts w/ ms + tz, pid, user, db, app, vxid/xid, log
      # line #, and qid=%Q — the server's own queryid, the exact join key the
      # auto_explain step prescribes (needs compute_query_id).
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d app=%a vxid=%v txid=%x line=%l qid=%Q "
      - -c
      - compute_query_id=on
      - -c
      - log_statement=none
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - log_checkpoints=on
      - -c
      # Log only spills a real operator would care about. At `0` (log EVERY
      # temp file) this rig produced 152,919 temp_file rows in a 2.5-minute
      # window -- 97% of ALL server-vantage data -- which buried every other
      # signal, tripped the collector's memory limiter ("data refused due to
      # high memory usage") and dropped the filelog rows that Slowest calls
      # and Deadlocks are built from.
      - log_temp_files=1MB
      - -c
      - max_connections=200
      - -c
      # The real Postgres default. Was 64kB, ~1000x smaller than production,
      # which made almost every sort spill to disk -- an unrealistic profile
      # that turned the exceptional temp_file event into the dominant one.
      # The workload's large sorts still exceed 4MB and still spill, so the
      # signal stays exercised; it is now RARE, as it is in production.
      - work_mem=4MB
    environment:
      POSTGRES_USER: dbm
      POSTGRES_PASSWORD: dbm
      POSTGRES_DB: dbmlab
    # A production-shaped host name, in ADDITION to the compose service name.
    # Whatever the collector connects THROUGH becomes the instance identity the
    # UI's "database" filter offers, and `postgres` reads as a placeholder
    # rather than a server an operator would recognise. The `postgres` alias is
    # kept so the workload's own PGHOST keeps resolving unchanged.
    networks:
      default:
        aliases:
          - pg-prod-1
    ports:
      - "55432:5432"
    volumes:
      - ./pg/init:/docker-entrypoint-initdb.d:ro
      - pglogs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbm -d dbmlab"]
      interval: 2s
      timeout: 3s
      retries: 40

  mysql:
    image: mysql:8.4
    container_name: dbm-sv-mysql
    command:
      - --performance-schema=ON
      - --performance-schema-instrument=wait/%=ON
      - --performance-schema-instrument=statement/%=ON
      - --performance-schema-consumer-events-statements-current=ON
      - --performance-schema-consumer-events-statements-history=ON
      - --performance-schema-consumer-events-statements-history-long=ON
      - --performance-schema-consumer-events-waits-current=ON
      - --performance-schema-consumer-events-waits-history=ON
      - --innodb-print-all-deadlocks=ON
      - --slow-query-log=ON
      - --long-query-time=0
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --log-error=/var/log/mysql/error.log
      - --log-error-verbosity=3
      - --innodb-lock-wait-timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: dbm
      MYSQL_DATABASE: dbmlab
      MYSQL_USER: dbm
      MYSQL_PASSWORD: dbm
    # A production-shaped host name, in ADDITION to the compose service name --
    # exactly as `postgres` carries `pg-prod-1` above, and for the same reason.
    # Whatever the collector connects THROUGH becomes the instance identity the
    # UI's "database" filter offers, and `mysql` reads as a placeholder rather
    # than a server an operator would recognise. my-rig.sh gives the collector
    # MYSQLHOST=my-prod-1, which the mysql recipes stamp into every row as
    # `server_address` and resource/ident upserts as server.address/host.name --
    # ONE value, so one server keeps ONE identity. The `mysql` alias is kept so
    # the workload's own MYSQL_HOST keeps resolving unchanged.
    networks:
      default:
        aliases:
          - my-prod-1
    ports:
      - "33306:3306"
    volumes:
      - ./pg/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysqllogs:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdbm"]
      interval: 3s
      timeout: 5s
      retries: 40

  # MariaDB answers the ONE question the MySQL container cannot: does MariaDB
  # write a deadlock as a single multi-line block, or split it across entries
  # the way MySQL 8's error-log components do? (dbm-engine-support.md §3.)
  # Settings mirror the MySQL service so the log format is the only variable.
  mariadb:
    image: mariadb:11
    container_name: dbm-sv-mariadb
    command:
      - --performance-schema=ON
      - --innodb-print-all-deadlocks=ON
      - --slow-query-log=ON
      - --long-query-time=0
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --log-error=/var/log/mysql/error.log
      - --innodb-lock-wait-timeout=10
      # MariaDB divergence: no --log-error-verbosity (MySQL 8 only). MariaDB
      # spells this log_warnings, and 3 is already the default for deadlocks.
    environment:
      MARIADB_ROOT_PASSWORD: dbm
      MARIADB_DATABASE: dbmlab
      MARIADB_USER: dbm
      MARIADB_PASSWORD: dbm
    ports:
      - "33307:3306"
    volumes:
      - ./pg/mariadb-init:/docker-entrypoint-initdb.d:ro
      - mariadblogs:/var/log/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pdbm"]
      interval: 3s
      timeout: 5s
      retries: 40

  # SQL Server makes the ALREADY-SHIPPED `sqlquery/mssql_blocking` recipe
  # runnable. It was written from the DMV docs and never executed against a real
  # instance — the same state the PG filelog regex was in when it turned out to
  # be silently broken. Also the source of a real deadlock XML graph for §4.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbm-sv-mssql
    user: "0:0" # entrypoint writes the init marker under /var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "dbm_Passw0rd#1"
      MSSQL_PID: Developer
    entrypoint: ["/bin/bash", "/init/entrypoint.sh"]
    ports:
      - "14330:1433"
    volumes:
      - ./mssql-init:/init:ro
      - mssqldata:/var/opt/mssql
    healthcheck:
      # Schema is applied by the entrypoint, so "healthy" must mean the FIXTURE
      # is ready, not merely that sqlservr answers — otherwise the workload
      # starts against missing tables.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d dbmlab -Q 'SELECT TOP 1 id FROM accounts' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7
    container_name: dbm-sv-redis
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: dbm-sv-collector
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      O2_ENDPOINT: ${O2_ENDPOINT:-http://host.docker.internal:5096}
      O2_ORG: ${O2_ORG:-default}
      O2_AUTH: ${O2_AUTH:?set O2_AUTH to the base64 basic-auth blob}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: dbm
      PGPASS: dbm
      PGDATABASE: dbmlab
      MYSQLHOST: mysql
      MYSQLPORT: "3306"
      MYSQLUSER: root
      MYSQLPASS: dbm
      MYSQLDB: dbmlab
      MARIAHOST: mariadb
      MARIAPORT: "3306"
      MARIAUSER: root
      MARIAPASS: dbm
      MARIADB: dbmlab
      MSSQLHOST: mssql
      MSSQLPORT: "1433"
      MSSQLUSER: sa
      MSSQLPASS: "dbm_Passw0rd#1"
      MSSQLDB: dbmlab
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - pglogs:/pglogs:ro
      - mysqllogs:/mysqllogs:ro
      - mariadblogs:/mariadblogs:ro
      - collectorstate:/var/lib/otelcol
      # raw-evidence sink: the `file/raw_logs` exporter writes every log record
      # here as OTLP-JSON, so the receiver events can be inspected without a live O2.
      - ./captures/raw:/rawout
    ports:
      - "14318:4318" # OTLP http in (workload client spans)
      - "14317:4317" # OTLP grpc in
      - "13134:13133" # health_check
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }

  workload:
    build: ./workload
    container_name: dbm-sv-workload
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: dbm
      PGPASSWORD: dbm
      PGDATABASE: dbmlab
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: dbm
      MYSQL_DB: dbmlab
      MARIA_HOST: mariadb
      MARIA_PORT: "3306"
      MARIA_USER: root
      MARIA_PASSWORD: dbm
      MARIA_DB: dbmlab
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "dbm_Passw0rd#1"
      MSSQL_DB: dbmlab
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEPLOY_ENV: dbm-sv
      DEADLOCK_PERIOD_SECS: "20"
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      mariadb: { condition: service_healthy }
      mssql: { condition: service_healthy }
      redis: { condition: service_healthy }
      collector: { condition: service_started }
    restart: unless-stopped

volumes:
  pglogs:
  mysqllogs:
  mariadblogs:
  mssqldata:
  collectorstate:
