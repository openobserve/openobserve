# One file-exporter pipeline per cell; CELL env var picks the output file.
# Rotation/compression: not configured => disabled (raw line-delimited OTLP JSON,
# one ExportTraceServiceRequest batch per line).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms

exporters:
  file:
    path: /out/${env:CELL}.jsonl
    format: json

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
